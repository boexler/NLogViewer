name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  packages: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Leftover MSBuild nodes keep obj/ files open and break subsequent WPF markup compilation.
  MSBUILDDISABLENODEREUSE: 1

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '8.x'

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v4.7.0
      with:
        versionSpec: '6.x'

    - name: Run GitVersion
      id: gitversion
      uses: gittools/actions/gitversion/execute@v4.7.0

    - name: Set version
      id: version
      shell: pwsh
      run: |
        $version = "${{ steps.gitversion.outputs.fullSemVer }}"
        $mp = "${{ steps.gitversion.outputs.majorMinorPatch }}"
        Add-Content $env:GITHUB_ENV "VERSION=$version"
        Add-Content $env:GITHUB_ENV "INSTALLER_VERSION=$mp.0"
        Add-Content $env:GITHUB_OUTPUT "version=$version"

    - name: Build solution
      # NLogViewer.CI.slnf omits WiX so compile/test does not harvest a 1.0.0.0 MSI.
      run: dotnet build NLogViewer.CI.slnf -c Release -m:1

    - name: Run tests
      run: dotnet test NLogViewer.CI.slnf -c Release --no-build --verbosity normal

    - name: Pack NuGet packages
      run: dotnet pack NLogViewer.CI.slnf -c Release --no-build -o nuget

    - name: Publish self-contained application
      run: |
        dotnet publish app/Sentinel.NLogViewer.App/Sentinel.NLogViewer.App.csproj `
          -c Release `
          -p:SelfContained=true `
          -p:PublishSingleFile=true `
          -p:RuntimeIdentifier=win-x64 `
          -p:Version=$env:VERSION `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -o publish/self-contained

    - name: Publish framework-dependent application
      run: |
        dotnet publish app/Sentinel.NLogViewer.App/Sentinel.NLogViewer.App.csproj `
          -c Release `
          -p:SelfContained=false `
          -p:RuntimeIdentifier=win-x64 `
          -p:Version=$env:VERSION `
          -o publish/framework-dependent

    - name: Prepare portable application folders
      run: |
        $folders = @(
          @{ Source = "publish/self-contained"; Target = "Sentinel.LogViewer-SelfContained-win-x64-$env:VERSION" },
          @{ Source = "publish/framework-dependent"; Target = "Sentinel.LogViewer-FrameworkDependent-win-x64-$env:VERSION" }
        )
        foreach ($folder in $folders) {
          Rename-Item -Path $folder.Source -NewName $folder.Target
          $targetPath = Join-Path "publish" $folder.Target
          New-Item -ItemType File -Path (Join-Path $targetPath "NLogViewer.portable") -Force | Out-Null
          Copy-Item "dist/portable/README-Portable.txt" $targetPath -Force
        }

    - name: Build installer MSI
      run: |
        dotnet build installer/Sentinel.NLogViewer.Installer.wixproj `
          -c Release `
          -m:1 `
          -p:InstallerVersion=$env:INSTALLER_VERSION
        Copy-Item "installer/bin/Release/Sentinel.LogViewer.msi" `
          "publish/Sentinel.LogViewer-$env:VERSION-win-x64.msi"

    - name: Pack Chocolatey package
      run: |
        New-Item -ItemType Directory -Force -Path chocolatey-packages | Out-Null
        Copy-Item "publish/Sentinel.LogViewer-$env:VERSION-win-x64.msi" `
          "chocolatey/tools/Sentinel.LogViewer.msi"
        choco pack chocolatey/Sentinel.LogViewer.nuspec `
          --version $env:VERSION `
          --output-directory chocolatey-packages

    - name: Upload NuGet packages
      uses: actions/upload-artifact@v7
      with:
        name: NuGet-${{ steps.version.outputs.version }}
        path: nuget
        if-no-files-found: error

    - name: Upload MSI
      uses: actions/upload-artifact@v7
      with:
        name: Sentinel.LogViewer-msi-${{ steps.version.outputs.version }}
        path: publish/Sentinel.LogViewer-${{ steps.version.outputs.version }}-win-x64.msi
        if-no-files-found: error

    - name: Upload self-contained application
      uses: actions/upload-artifact@v7
      with:
        name: Sentinel.LogViewer-SelfContained-win-x64-${{ steps.version.outputs.version }}
        path: publish/Sentinel.LogViewer-SelfContained-win-x64-${{ steps.version.outputs.version }}
        if-no-files-found: error

    - name: Upload framework-dependent application
      uses: actions/upload-artifact@v7
      with:
        name: Sentinel.LogViewer-FrameworkDependent-win-x64-${{ steps.version.outputs.version }}
        path: publish/Sentinel.LogViewer-FrameworkDependent-win-x64-${{ steps.version.outputs.version }}
        if-no-files-found: error

    - name: Upload Chocolatey package
      uses: actions/upload-artifact@v7
      with:
        name: Chocolatey-Sentinel.LogViewer-${{ steps.version.outputs.version }}
        path: chocolatey-packages
        if-no-files-found: error

    - name: Create portable ZIP archives
      run: |
        $folders = @(
          "publish/Sentinel.LogViewer-SelfContained-win-x64-$env:VERSION",
          "publish/Sentinel.LogViewer-FrameworkDependent-win-x64-$env:VERSION"
        )
        foreach ($folder in $folders) {
          Compress-Archive -Path (Join-Path $folder '*') -DestinationPath "$folder.zip"
        }

    - name: Upload GitHub Release assets
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $tag = "${{ github.ref_name }}"
        $title = "Sentinel.LogViewer $env:VERSION"
        $assets = @(
          Get-ChildItem nuget -Filter '*.nupkg'
          Get-ChildItem chocolatey-packages -Filter '*.nupkg'
          Get-ChildItem publish -Filter '*.msi'
          Get-ChildItem publish -Filter '*.zip'
        ) | ForEach-Object { $_.FullName }

        gh release view $tag --json id 2>$null
        if ($LASTEXITCODE -eq 0) {
          gh release upload $tag @assets --clobber
        } else {
          gh release create $tag @assets `
            --title $title `
            --generate-notes `
            --target ${{ github.sha }}
        }

    - name: Push NuGet packages
      run: |
        dotnet nuget add source `
          "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
          --name github `
          --username "${{ github.repository_owner }}" `
          --password "${{ github.token }}" `
          --store-password-in-clear-text
        $packages = @(Get-ChildItem nuget -Filter '*.nupkg')
        if ($packages.Count -eq 0) {
          throw "No NuGet packages were found in nuget/."
        }
        foreach ($package in $packages) {
          dotnet nuget push $package.FullName --source github --skip-duplicate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet nuget push $package.FullName `
            --source "https://api.nuget.org/v3/index.json" `
            --api-key "${{ secrets.NUGET_API_KEY }}" `
            --skip-duplicate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }

    - name: Push Chocolatey package
      run: |
        $packages = @(Get-ChildItem chocolatey-packages -Filter "*.nupkg")
        if ($packages.Count -ne 1) {
          throw "Expected exactly one Chocolatey package, found $($packages.Count)."
        }
        choco push $packages[0].FullName `
          --source "https://push.chocolatey.org/" `
          --api-key "${{ secrets.CHOCOLATEY_API_KEY }}"

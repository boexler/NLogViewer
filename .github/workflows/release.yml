name: Release
on:
  push:
    tags:
      - '*'
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true  
jobs:
  build:
    name: Build
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '8.x'
    - name: Build solution
      run: dotnet build -c Release
    - name: Run tests
      run: dotnet test -c Release --no-build --verbosity normal
    - name: Pack NuGet packages
      run: dotnet pack -c Release --no-build -o nuget
    - name: Upload nuget packages as artifacts
      uses: actions/upload-artifact@v7
      with:
        name: NuGet
        path: nuget
        if-no-files-found: error

  publish-app:
    name: Publish Application
    needs: [build]
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '8.x'
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v4.7.0
      with:
        versionSpec: '6.x'
    - name: Run GitVersion
      id: gitversion
      uses: gittools/actions/gitversion/execute@v4.7.0
    - name: Set VERSION environment variable
      run: |
        $version = "${{ steps.gitversion.outputs.fullSemVer }}"
        Add-Content $env:GITHUB_ENV "VERSION=$version"
    - name: Publish Self-Contained
      run: |
        dotnet publish app/Sentinel.NLogViewer.App/Sentinel.NLogViewer.App.csproj `
          -c Release `
          -p:SelfContained=true `
          -p:PublishSingleFile=true `
          -p:RuntimeIdentifier=win-x64 `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -o publish/self-contained
    - name: Publish Framework-Dependent
      run: |
        dotnet publish app/Sentinel.NLogViewer.App/Sentinel.NLogViewer.App.csproj `
          -c Release `
          -p:SelfContained=false `
          -p:RuntimeIdentifier=win-x64 `
          -o publish/framework-dependent
    - name: Rename folders with version
      run: |
        $version = $env:VERSION
        Rename-Item -Path "publish/self-contained" -NewName "NLogViewer-SelfContained-win-x64-$version"
        Rename-Item -Path "publish/framework-dependent" -NewName "NLogViewer-FrameworkDependent-win-x64-$version"
    - name: Add portable marker and readme to published folders
      run: |
        $version = $env:VERSION
        $folders = @(
          "publish/NLogViewer-SelfContained-win-x64-$version",
          "publish/NLogViewer-FrameworkDependent-win-x64-$version"
        )
        foreach ($d in $folders) {
          New-Item -ItemType File -Path (Join-Path $d "NLogViewer.portable") -Force | Out-Null
          Copy-Item -Path "dist/portable/README-Portable.txt" -Destination (Join-Path $d "README-Portable.txt") -Force
        }
    - name: Build installer MSI
      run: |
        $mp = "${{ steps.gitversion.outputs.majorMinorPatch }}"
        $installerVersion = "$mp.0"
        dotnet build installer/Sentinel.NLogViewer.Installer.wixproj -c Release -p:InstallerVersion=$installerVersion
        New-Item -ItemType Directory -Force -Path publish | Out-Null
        Copy-Item installer/bin/Release/NLogViewer.msi "publish/NLogViewer-$($env:VERSION)-win-x64.msi"
    - name: Upload MSI artifact
      uses: actions/upload-artifact@v7
      with:
        name: NLogViewer-msi
        path: publish/NLogViewer-${{ env.VERSION }}-win-x64.msi
        if-no-files-found: error
    - name: Upload Self-Contained artifact
      uses: actions/upload-artifact@v7
      with:
        name: NLogViewer-SelfContained-win-x64
        path: publish/NLogViewer-SelfContained-win-x64-${{ env.VERSION }}
        if-no-files-found: error
    - name: Upload Framework-Dependent artifact
      uses: actions/upload-artifact@v7
      with:
        name: NLogViewer-FrameworkDependent-win-x64
        path: publish/NLogViewer-FrameworkDependent-win-x64-${{ env.VERSION }}
        if-no-files-found: error

  publish:
    name: Publish
    needs: [build, publish-app]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '8.x'
    - name: Download nuget artifacts
      uses: actions/download-artifact@v8
      with:
        name: NuGet
        path: nuget
    - name: Download application artifacts
      uses: actions/download-artifact@v8
      with:
        name: NLogViewer-SelfContained-win-x64
        path: artifacts
    - name: Download application artifacts
      uses: actions/download-artifact@v8
      with:
        name: NLogViewer-FrameworkDependent-win-x64
        path: artifacts
    - name: Download MSI artifact
      uses: actions/download-artifact@v8
      with:
        name: NLogViewer-msi
        path: artifacts
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v4.7.0
      with:
        versionSpec: '6.x'
    - name: Run GitVersion
      id: gitversion
      uses: gittools/actions/gitversion/execute@v4.7.0
    - name: Create versioned ZIPs
      run: |
        cd artifacts
        # Each downloaded artifact is in its own directory
        # Find the versioned folder inside and create a ZIP from it
        for artifactDir in */; do
          if [ -d "$artifactDir" ]; then
            cd "$artifactDir"
            # The versioned folder should be the only subdirectory
            for versionedDir in */; do
              if [ -d "$versionedDir" ]; then
                dirname=$(basename "$versionedDir")
                zipname="${dirname}.zip"
                cd "$versionedDir"
                zip -r "../../$zipname" .
                cd ..
                break
              fi
            done
            cd ..
          fi
        done
    - name: Get release
      id: get_release
      uses: actions/github-script@v8
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        result-encoding: string
        script: |
          const tag = context.ref.replace(/^refs\/tags\//, '');
          const { data } = await github.rest.repos.getReleaseByTag({
            owner: context.repo.owner,
            repo: context.repo.repo,
            tag
          });
          return String(data.id);
    - name: Upload artifacts to release
      uses: actions/github-script@v8
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');
          const path = require('path');

          const release_id = '${{ steps.get_release.outputs.result }}';
          
          // Upload NuGet packages
          const nugetDir = './nuget';
          if (fs.existsSync(nugetDir)) {
            const nugetFiles = fs.readdirSync(nugetDir);
            for (const file of nugetFiles) {
              const filePath = path.join(nugetDir, file);
              const data = fs.readFileSync(filePath);
              const stats = fs.statSync(filePath);

              console.log(`Uploading NuGet asset: ${file} (${stats.size} bytes)`);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release_id,
                name: file,
                data: data,
                headers: {
                  'content-type': 'application/octet-stream',
                  'content-length': stats.size.toString()
                }
              });
            }
          }
          
          function collectFilesRecursive(dir, out) {
            if (!fs.existsSync(dir)) return;
            for (const name of fs.readdirSync(dir)) {
              const filePath = path.join(dir, name);
              const stats = fs.statSync(filePath);
              if (stats.isDirectory()) {
                collectFilesRecursive(filePath, out);
              } else if (stats.isFile()) {
                out.push(filePath);
              }
            }
          }

          // Upload application artifacts (ZIP from bash step, plus MSI from nested artifact paths)
          const artifactsDir = './artifacts';
          const artifactFiles = [];
          collectFilesRecursive(artifactsDir, artifactFiles);
          for (const filePath of artifactFiles) {
            const file = path.basename(filePath);
            const stats = fs.statSync(filePath);
            if (file.endsWith('.zip')) {
              const data = fs.readFileSync(filePath);
              console.log(`Uploading application asset: ${file} (${stats.size} bytes)`);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release_id,
                name: file,
                data: data,
                headers: {
                  'content-type': 'application/zip',
                  'content-length': stats.size.toString()
                }
              });
            } else if (file.endsWith('.msi')) {
              const data = fs.readFileSync(filePath);
              console.log(`Uploading application asset: ${file} (${stats.size} bytes)`);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release_id,
                name: file,
                data: data,
                headers: {
                  'content-type': 'application/octet-stream',
                  'content-length': stats.size.toString()
                }
              });
            }
          }
    - name: Publish the package to GitHub Packages & nuget.org    
      run: |
        dotnet nuget add source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --name github --username ${{ github.repository_owner }} --password ${{ github.token }} --store-password-in-clear-text
        dotnet nuget push ./nuget/*.nupkg --source github
        dotnet nuget push ./nuget/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }}